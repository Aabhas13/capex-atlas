name: update-data
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python update_data.py capex-atlas.html data.json
      - name: Commit data.json
        run: |
          git config user.name "capex-atlas-bot"
          git config user.email "capex-atlas-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Daily data update" && git push)
